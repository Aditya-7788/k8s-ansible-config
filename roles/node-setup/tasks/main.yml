---
- name: Ensure supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", ">=")
    fail_msg: "node-setup supports Ubuntu 24.04 and newer Ubuntu releases."

- name: Refresh apt package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install host prerequisites
  ansible.builtin.apt:
    name: "{{ node_setup_packages }}"
    state: present

- name: Install SSH hardening drop-in
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: "{{ node_setup_ssh_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Load bridge netfilter modules
  ansible.builtin.command:
    cmd: modprobe {{ item }}
  loop:
    - br_netfilter
    - bridge
  changed_when: false

- name: Persist bridge netfilter modules
  ansible.builtin.copy:
    content: "br_netfilter\nbridge\n"
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"

- name: Set kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
  loop: "{{ node_setup_kernel_parameters }}"

- name: Allow required inbound TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ node_setup_ufw_allowed_tcp_ports }}"

- name: Enable uncomplicated firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable unattended security upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
    creates: "{{ containerd_config_path }}"
  register: node_setup_containerd_default

- name: Write default containerd configuration
  ansible.builtin.copy:
    content: "{{ node_setup_containerd_default.stdout }}\n"
    dest: "{{ containerd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  when: node_setup_containerd_default.changed
  notify: Restart containerd

- name: Configure containerd to use systemd cgroups
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_path }}"
    regexp: '^(\s*)SystemdCgroup = false$'
    line: '\1SystemdCgroup = {{ containerd_systemd_cgroup | lower }}'
    backrefs: true
  notify: Restart containerd

- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started
