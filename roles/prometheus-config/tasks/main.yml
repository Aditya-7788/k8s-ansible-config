---
- name: Create Prometheus file-SD directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/file_sd"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Render node-exporter file-SD targets
  ansible.builtin.template:
    src: node-targets.yml.j2
    dest: "{{ prometheus_config_dir }}/file_sd/node-targets.yml"
    owner: prometheus
    group: prometheus
    mode: "0640"
  notify: Restart Prometheus
