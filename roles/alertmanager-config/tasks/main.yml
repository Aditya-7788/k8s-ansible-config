---
- name: Ensure Alertmanager configuration directory exists
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: "0750"

- name: Ensure Prometheus alert rules directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/rules.d"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Render Alertmanager receiver configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: alertmanager
    group: alertmanager
    mode: "0640"
  notify: Restart Alertmanager

- name: Render Prometheus alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules.d/alert-rules.yml"
    owner: prometheus
    group: prometheus
    mode: "0640"
  notify: Restart Prometheus
